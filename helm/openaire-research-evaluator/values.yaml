# Default values for openaire-research-evaluator.
# Override with --set or a custom values file.

image:
  repository: ethicalabs/openaire-research-evaluator
  tag: latest
  pullPolicy: Always

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  host: openaire-eval.local

# ── Secrets (set via --set or secrets manager) ────────────────────────────────
secrets:
  secretKey: ""
  hfToken: ""
  hfClientId: ""
  hfClientSecret: ""
  geminiApiKey: ""
  apiKey: "echo-dsrn-mcp-change-me-in-production"
  postgresPassword: ""

# ── Configuration ─────────────────────────────────────────────────────────────
config:
  appBaseUrl: "http://localhost:7860"
  appPort: 7860
  # LLM server URL (OpenAI-compatible). Override at install time:
  #   --set config.llmBaseUrl="http://192.168.1.66:13305/v1"
  llmBaseUrl: "http://host.docker.internal:13305/v1"
  llmApiKey: "not-needed"
  hfDatasetsUrl: "https://huggingface.co/collections/ethicalabs/openaire-ai-hackathon-2026"
  hubReadOnly: false
  # Active collab annotation round — the model version being annotated now.
  # Stamped on all new papers/annotations; the hub filters by it by default.
  modelVersion: "v0.1.4"

# ── PostgreSQL ────────────────────────────────────────────────────────────────
# Set externalUrl to use a managed PostgreSQL (skips built-in deployment).
# Example: "postgresql+psycopg2://user:pass@host:5432/echo_dsrn"
postgres:
  externalUrl: ""
  image: ankane/pgvector:v0.5.1
  storage: 2Gi

# ── Redis ─────────────────────────────────────────────────────────────────────
# Set externalUrl to use a managed Redis (skips built-in deployment).
# Example: "redis://host:6379/0"
redis:
  externalUrl: ""
  image: redis:7-alpine

# ── Resources ─────────────────────────────────────────────────────────────────
web:
  replicas: 1
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m

worker:
  replicas: 1
  concurrency: 2
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 4Gi
      cpu: 2000m
