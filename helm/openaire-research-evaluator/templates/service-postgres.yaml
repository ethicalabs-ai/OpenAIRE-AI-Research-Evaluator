{{- if not .Values.postgres.externalUrl }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-postgres
  labels: {{ include "chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    component: postgres
{{- end }}
