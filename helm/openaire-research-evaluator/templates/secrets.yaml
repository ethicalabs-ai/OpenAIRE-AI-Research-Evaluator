apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secrets
  labels: {{ include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  HF_CLIENT_ID: {{ .Values.secrets.hfClientId | quote }}
  HF_CLIENT_SECRET: {{ .Values.secrets.hfClientSecret | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ if .Values.postgres.externalUrl }}{{ .Values.postgres.externalUrl | quote }}{{ else }}"postgresql+psycopg2://postgres:{{ .Values.secrets.postgresPassword }}@{{ include "chart.fullname" . }}-postgres:5432/echo_dsrn"{{ end }}
