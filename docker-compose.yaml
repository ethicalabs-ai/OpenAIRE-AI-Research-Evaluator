services:
  postgres:
    image: postgres:16-alpine
    container_name: echo_dsrn_graph_postgres
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo_dsrn
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo_dsrn"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: echo_dsrn_graph_redis
    restart: unless-stopped

  web:
    image: echo-dsrn-graph
    container_name: echo_dsrn_graph_web
    ports:
      - "0.0.0.0:7860:7860"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://echo:echo@postgres:5432/echo_dsrn
      - REDIS_URL=redis://redis:6379/0
      - PORT=7860
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/uploads:/app/data/uploads
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  worker-cpu:
    image: echo-dsrn-graph
    container_name: echo_dsrn_graph_worker_cpu
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://echo:echo@postgres:5432/echo_dsrn
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_TYPE=worker-cpu
      - CONCURRENCY=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  pg_data:
  hf_cache:
