site_name: OpenAIRE-AI-Research-Evaluator
site_description: Multi-model LLM-as-Judge pipeline for the OpenAIRE AI Hackathon 2026
repo_url: https://github.com/ethicalabs-ai/OpenAIRE-AI-Research-Evaluator
# HF static Spaces do not serve index.html for directory URLs (story/ falls
# back to the HF site) — link to explicit story/index.html instead.
use_directory_urls: false
theme:
  name: material
  palette:
    primary: custom
nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Architecture: architecture.md
  - LLM-as-Judge: llm-as-judge.md
  - MCP: mcp.md
  - OAuth: oauth.md
  - Inference: inference.md
  - Hackathon Story: story.md
  - Deployment: deployment.md
  - License: license.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - tables
